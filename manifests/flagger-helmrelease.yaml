---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: flagger
  namespace: flux-system
  labels:
    app.kubernetes.io/name: flagger
    app.kubernetes.io/part-of: kemo
spec:
  interval: 1h
  url: https://flagger.app
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flux-system
  labels:
    app.kubernetes.io/name: flagger
    app.kubernetes.io/part-of: kemo
spec:
  interval: 10m
  releaseName: flagger
  targetNamespace: traefik
  chart:
    spec:
      chart: flagger
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: flagger
  values:
    meshProvider: traefik
    prometheus:
      install: true
