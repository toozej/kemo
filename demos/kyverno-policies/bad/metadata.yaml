---
name: Kyverno Policy Rejection
description: |
  Submit a Deployment that does not meet a Kyverno Policy requirement.
source: https://kyverno.io/docs/policy-types/cluster-policy/validate/
tags: [kyverno, policy-as-code, validation, admission-control, security, bad]
objectives:
  - Install the Kyverno admission controller
  - Apply a namespaced Kyverno Policy in Enforce mode
  - Submit a Deployment without the required labels
  - Observe the expected admission rejection
observations:
  - Kyverno rejects the Deployment
  - No policy-rejected Deployment is created
  - The Policy remains active in the demo namespace
