---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eso-example
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: eso-store
    kind: SecretStore
  target:
    name: eso-synced
    creationPolicy: Owner
  data:
    - secretKey: SECRET_VALUE
      remoteRef:
        key: eso-backing
        property: SECRET_VALUE
