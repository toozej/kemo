---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.kemo.toozej.github.io
spec:
  group: kemo.toozej.github.io
  names:
    kind: Widget
    plural: widgets
    singular: widget
    shortNames:
      - wg
    categories:
      - all
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Size
          type: string
          jsonPath: .spec.size
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
      schema:
        openAPIV3Schema:
          type: object
          description: Widget is a sample CRD demonstrating validation and printer columns.
          properties:
            spec:
              type: object
              required:
                - size
                - replicas
                - image
              properties:
                size:
                  type: string
                  description: Logical size of the widget.
                  enum:
                    - small
                    - medium
                    - large
                  default: small
                replicas:
                  type: integer
                  minimum: 0
                  description: Desired replica count for the widget (for demo purposes only).
                  default: 1
                image:
                  type: string
                  description: Container image reference (informational in this demo).
                enableTLS:
                  type: boolean
                  description: Toggle for TLS (informational in this demo).
                  default: false
            status:
              type: object
              properties:
                phase:
                  type: string
      subresources:
        status: {}
