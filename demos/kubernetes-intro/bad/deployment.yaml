---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-intro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-intro
  template:
    metadata:
      labels:
        app: k8s-intro
    spec:
      containers:
        - name: nginx
          image: nginx:this-tag-does-not-exist-anywhere
          ports:
            - containerPort: 80
