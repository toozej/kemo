---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-intro
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kubernetes-intro-good.k8s.orb.local
      secretName: demo-tls
  rules:
    - host: kubernetes-intro-good.k8s.orb.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: k8s-intro
                port:
                  number: 80
